
# Save this file as: .github/workflows/metrics.yml
# Needs a repository secret named METRICS_TOKEN (a classic personal access token).

name: Metrics

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg
          base: header, activity, community, repositories, metadata
          config_timezone: Africa/Tunis
          # Languages and coding habits
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_habits: yes
          plugin_habits_days: 14
          plugin_habits_charts: yes
          # 3D contribution calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          # Optional: PageSpeed score for your site. Remove these two lines if you have none.
          # plugin_pagespeed: yes
          # plugin_pagespeed_url: https://your-site.com
